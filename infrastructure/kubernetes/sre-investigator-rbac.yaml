apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-investigator
  namespace: ai-reliability-lab
  labels:
    app.kubernetes.io/part-of: ai-platform-reliability-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sre-investigator-readonly
  namespace: ai-reliability-lab
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sre-investigator-readonly
  namespace: ai-reliability-lab
subjects:
  - kind: ServiceAccount
    name: sre-investigator
    namespace: ai-reliability-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sre-investigator-readonly
