apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-demo
  namespace: ai-reliability-lab
  labels:
    app: incident-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: incident-demo
  template:
    metadata:
      labels:
        app: incident-demo
    spec:
      containers:
        - name: incident-demo
          image: localhost/incident-demo:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: incident-demo
  namespace: ai-reliability-lab
spec:
  selector:
    app: incident-demo
  ports:
    - name: http
      port: 8080
      targetPort: http
